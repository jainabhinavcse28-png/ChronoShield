version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cyber_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cyber_attack_db
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5.18-community
    container_name: cyber_neo4j
    restart: always
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data

  app:
    build: .
    container_name: cyber_attack_graph_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB_NAME=cyber_attack_db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - PORT=5000
    depends_on:
      - mongodb
      - neo4j

volumes:
  mongo_data:
  neo4j_data:
